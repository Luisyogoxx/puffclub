<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1828"/>
      <stop offset="70%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>
    
    <!-- Neon Cyan / Blue Gradient -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#0051ff"/>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base with Rounded Borders -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" stroke="#00f0ff" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Glowing Outer Neon Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#neonBlue)" stroke-width="12" stroke-dasharray="8 6" opacity="0.6" filter="url(#glow)"/>

  <!-- Stylized Vapor Wave Background -->
  <path d="M160 380 Q 220 310 256 350 T 352 300" fill="none" stroke="#00d2ff" stroke-width="10" stroke-linecap="round" opacity="0.3" filter="url(#glow)"/>

  <!-- Bold Neon Letter 'P' with Cloud / Vapor Crown -->
  <g filter="url(#glow)">
    <!-- Stem of P -->
    <path d="M175 140 L 175 372" stroke="url(#neonBlue)" stroke-width="44" stroke-linecap="round"/>
    
    <!-- Loop of P -->
    <path d="M175 140 H 280 C 345 140 345 250 280 250 H 175" fill="none" stroke="url(#neonBlue)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Inner Vapor Star / Sparkle -->
    <path d="M375 135 Q 375 165 405 165 Q 375 165 375 195 Q 375 165 345 165 Q 375 165 375 135 Z" fill="#00f0ff" filter="url(#glow)"/>
    <circle cx="375" cy="165" r="5" fill="#ffffff"/>
  </g>

  <!-- Bottom Tag Accent 'CLUB' -->
  <rect x="180" y="396" width="152" height="34" rx="17" fill="url(#neonBlue)" opacity="0.95"/>
  <text x="256" y="420" font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="20" fill="#030712" text-anchor="middle" letter-spacing="4">CLUB</text>
</svg>